<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eagle Company // Buyer Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a1220; --panel:#101c30; --panel-raised:#16273f;
    --border:#213a58; --border-bright:#345880;
    --text:#eef2f7; --text-dim:#8ba0ba;
    --amber:#ffffff; --orange:#d4af37; --orange-dim:#a3841f;
    --green:#4ade80; --red:#ff5c5c;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--void); color:var(--text); font-family:'Inter',sans-serif; font-size:14px;}
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,.eyebrow,th{font-family:'Rajdhani',sans-serif; letter-spacing:.03em;}
  header{padding:18px 22px 16px; border-bottom:2px solid var(--orange); box-shadow:0 4px 0 -2px var(--void), 0 5px 0 -2px rgba(255,255,255,.35); background:linear-gradient(180deg,#0d1a2c,#0a1220);}
  header h1{margin:0; font-size:22px; font-weight:700; text-transform:uppercase;}
  header h1 span{color:var(--orange);}
  header .sub{color:var(--text-dim); font-size:11px; text-transform:uppercase; letter-spacing:.14em; margin-top:2px;}
  main{padding:22px; max-width:960px; margin:0 auto;}
  .panel{background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:18px; margin-bottom:16px;}
  .panel.active-need{border:2px solid var(--orange); background:linear-gradient(180deg, rgba(212,175,55,.10), var(--panel) 40%); box-shadow:0 0 0 1px rgba(212,175,55,.15);}
  .panel-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;}
  .panel-head h2{margin:0; font-size:17px; text-transform:uppercase;}
  .eyebrow{font-size:11px; color:var(--orange); text-transform:uppercase; letter-spacing:.14em;}
  .muted{color:var(--text-dim);}
  .pill{display:inline-block; padding:2px 8px; border-radius:99px; font-size:11px; font-weight:700; text-transform:uppercase;}
  .pill.ok{background:rgba(74,222,128,.15); color:var(--green);}
  .pill.warn{background:rgba(212,175,55,.15); color:var(--orange);}
  table{width:100%; border-collapse:collapse; margin-top:8px;}
  th{text-align:left; font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; padding:6px 8px; border-bottom:1px solid var(--border);}
  td{padding:8px; border-bottom:1px solid var(--border); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  a.link{color:var(--orange); text-decoration:none; font-weight:600;}
  a.link:hover{text-decoration:underline;}
  .empty{color:var(--text-dim); font-style:italic; text-align:center; padding:26px 0;}
  .loader{display:inline-block; width:14px; height:14px; border:2px solid var(--border-bright); border-top-color:var(--orange); border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .refresh-note{font-size:11px; color:var(--text-dim); margin-top:14px; text-align:right;}
  .btn{background:var(--panel-raised); border:1px solid var(--border-bright); color:var(--text); padding:7px 14px; border-radius:4px; cursor:pointer; font-size:13px; font-weight:600; text-transform:uppercase; font-family:'Rajdhani',sans-serif;}
  .btn:hover{border-color:var(--orange); color:var(--orange);}
  nav{display:flex; gap:2px; padding:0 22px; border-bottom:1px solid var(--border); background:#0c1626;}
  .tab{padding:12px 18px; cursor:pointer; color:var(--text-dim); font-weight:600; text-transform:uppercase; font-size:13px; border-bottom:2px solid transparent; user-select:none; font-family:'Rajdhani',sans-serif;}
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--orange); border-bottom-color:var(--orange);}
</style>
</head>
<body>
<header>
  <h1>Eagle Company<span> // </span>Buyer Board</h1>
  <div class="sub">Current material needs &middot; live UEX prices</div>
</header>
<nav id="tabs">
  <div class="tab" data-tab="buylist">Buy List</div>
  <div class="tab" data-tab="mining">Mining Operations</div>
</nav>
<main id="app">
  <div class="panel"><div class="empty"><span class="loader"></span> Loading&hellip;</div></div>
</main>

<script>
const API_BASE = 'https://api.uexcorp.uk/2.0';

// Set these once to your repo's raw file paths. ?src=<url> / ?materialsSrc=<url> query
// params override for one-off testing without editing the file.
const DEFAULT_SOURCE = 'https://raw.githubusercontent.com/slaghag/slag-tools/main/data/purchase-order.json';
const MATERIALS_SOURCE = 'https://raw.githubusercontent.com/slaghag/slag-tools/main/data/materials.json';
const PRICING_SOURCE = 'https://raw.githubusercontent.com/slaghag/slag-tools/main/data/pricing-config.json';

function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtNum(n){ return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:3}); }
function fmtMoney(n){ return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0}); }

function unitMultiplier(listingUnit, unitBasis){
  const u = (listingUnit||'').toLowerCase();
  if(unitBasis==='piece'){ return (u==='unit'||u==='un') ? 1 : null; }
  if(u==='scu') return 1;
  if(u==='unit'||u==='un') return 1;
  if(u==='cscu') return 0.01;
  return null;
}

// UEX's own coarse 8-tier bucketing for marketplace_prices_averages, confirmed via
// live testing: Q0, Q1-499, Q500-599, Q600-699, Q700-799, Q800-899, Q900-949, Q950-1000
function qualityToTier(q){
  q = Number(q)||0;
  if(q<=0) return 0;
  if(q<500) return 1;
  if(q<600) return 2;
  if(q<700) return 3;
  if(q<800) return 4;
  if(q<900) return 5;
  if(q<950) return 6;
  return 7;
}

function marketplaceHomeUrl(item, operation, sort){
  operation = operation || 'sell';
  const params = new URLSearchParams({
    search: item.name, mode:'list', operation, quality_start: item.quality, sort: sort || (operation==='sell'?'price_asc':'price_desc')
  });
  if(item.idCategory) params.set('id_category', item.idCategory);
  return `https://uexcorp.space/marketplace/home/?${params.toString()}`;
}

async function fetchAveragePrice(idItem, quality, unitBasis, operation){
  operation = operation || 'sell';
  const tier = qualityToTier(quality);
  const res = await fetch(`${API_BASE}/marketplace_prices_averages?id_item=${idItem}&quality_tier=${tier}&operation=${operation}`);
  const json = await res.json();
  if(json.status !== 'ok' || !json.data || !json.data.length) return null;
  // Confirmed via live testing: this endpoint silently ignores the operation/unit query
  // filters and returns every operation+denomination combination it has for this
  // item+tier (a `buy` record came back despite operation=sell in the URL). We have to
  // pick the right one client-side rather than trusting data[0].
  const opRecords = json.data.filter(d=>d.operation===operation);
  if(!opRecords.length) return null;
  // Prefer "unit" (matches what the item's own UEX page displays by default, and what
  // most sellers actually price in) -- fall back to "scu" for scu-basis materials since
  // we already treat those as equivalent, or just take whatever's there as a last resort.
  const preferred = unitBasis==='piece' ? ['unit','un'] : ['unit','un','scu'];
  let d = null;
  for(const p of preferred){
    d = opRecords.find(r=>(r.unit||'').toLowerCase()===p);
    if(d) break;
  }
  if(!d) d = opRecords[0];
  // UEX's own averages page states this reflects "trusted participants over the last 30
  // days" -- price_avg_month is the field matching that stated window. Confirmed
  // empirically: the "unit" sell record's price_avg_month matched the page's displayed
  // 17.8M for Iron/tier7/sell exactly.
  const rawPrice = Number(d.price_avg_month)||0;
  // Normalize to the same per-SCU-or-piece basis the listings table uses below, so the
  // two numbers are actually comparable -- a cSCU-denominated average shown next to
  // two numbers are actually comparable -- a cSCU-denominated average shown next to
  // SCU-denominated listings would otherwise look ~100x cheaper than it really is.
  const mult = unitMultiplier(d.unit, unitBasis);
  if(mult===null) return null; // can't safely normalize this denomination -- don't show a misleading number
  return { price: rawPrice/mult, unit: unitBasis==='piece'?'piece':'scu', listingsCount: Number(d.listings_count)||0 };
}

async function fetchTopListings(idItem, minQuality, unitBasis, count){
  const res = await fetch(`${API_BASE}/marketplace_listings?id_item=${idItem}&operation=sell`);
  const json = await res.json();
  if(json.status !== 'ok') throw new Error(json.message||'UEX API error');
  const now = Date.now()/1000;
  return json.data
    // price<=0 is never a real sell offer -- placeholder, mistake, or bait, not something
    // to hand a buyer a link to
    .filter(d => !d.is_sold_out && (!d.date_expiration || d.date_expiration > now) && Number(d.quality)>=minQuality && Number(d.price)>0)
    .map(d=>{
      const mult = unitMultiplier(d.unit, unitBasis);
      return {
        price:Number(d.price)||0, unit:d.unit||'unit', quality:Number(d.quality)||0,
        location:d.location||'', seller:d.user_username||'', inStock:d.in_stock!=null?Number(d.in_stock):null,
        link:`https://uexcorp.space/marketplace/item/info/${d.slug}`,
        normPrice: mult!==null ? (Number(d.price)||0)/mult : null
      };
    })
    .filter(l=>l.normPrice!==null)
    .sort((a,b)=>a.normPrice-b.normPrice)
    .slice(0, count||3);
}

function renderMaterialCard(item, listings, err, avg){
  const basisLabel = (item.unitBasis==='piece') ? 'piece' : 'SCU';
  let body;
  if(err){
    body = `<div class="empty">Couldn't load live prices for this item right now.</div>`;
  } else if(!listings.length){
    body = `<div class="empty">No qualifying listings found at Q${item.quality}+ right now.</div>`;
  } else {
    body = `<table>
      <thead><tr><th>Price</th><th>Quality</th><th>Stock</th><th>Seller</th><th>Location</th><th></th></tr></thead>
      <tbody>${listings.map(l=>`
        <tr>
          <td class="mono">${fmtMoney(l.price)} aUEC/${esc(l.unit)}</td>
          <td class="mono">Q${l.quality}</td>
          <td class="mono">${l.inStock!=null?fmtNum(l.inStock):'&mdash;'}</td>
          <td>${esc(l.seller||'&mdash;')}</td>
          <td>${esc(l.location||'&mdash;')}</td>
          <td><a class="link" href="${esc(l.link)}" target="_blank" rel="noopener">Buy &rarr;</a></td>
        </tr>`).join('')}</tbody>
    </table>`;
  }
  const nameHtml = item.idItem
    ? `<a class="link" href="${esc(marketplaceHomeUrl(item,'sell'))}" target="_blank" rel="noopener" title="See all listings for this material at this quality or better">${esc(item.name)}</a>`
    : esc(item.name);
  const avgHtml = avg
    ? `<span class="muted mono" style="font-size:12px; margin-left:10px" title="UEX's own trusted-average calculation, separate from the raw listings table below -- a low count here means treat this number cautiously">avg ${fmtMoney(avg.price)} aUEC/${esc(avg.unit)} <span class="${avg.listingsCount<3?'pill warn':''}" style="font-size:10px">(${avg.listingsCount} listing${avg.listingsCount===1?'':'s'})</span></span>`
    : '';
  return `
  <div class="panel">
    <div class="panel-head">
      <h2>${nameHtml}${avgHtml}</h2>
      <span class="pill ${item.qty>0?'warn':'ok'}">need ${fmtNum(item.qty)} ${basisLabel} &middot; &ge;Q${item.quality}</span>
    </div>
    ${item.note ? `<div class="muted" style="font-size:12px; margin-bottom:6px">${esc(item.note)}</div>` : ''}
    ${!item.idItem ? '<div class="empty">No UEX catalog link for this material.</div>' : body}
  </div>`;
}

// "Band 7" = the second-highest quality value in a material's own quantization table
// (index length-2 of the sorted bands array), not UEX's coarser market-tier bucketing.
// Falls back gracefully if fewer than 2 bands are on record.
function band7Quality(material){
  const bands = material.qualityBands;
  if(!bands || !bands.length) return null;
  if(bands.length===1) return bands[0];
  return bands[bands.length-2];
}

function renderMiningCard(item){
  const basisLabel = (item.unitBasis==='piece') ? 'piece' : 'SCU';
  const nameHtml = item.idItem
    ? `<a class="link" href="${esc(marketplaceHomeUrl(item,'sell'))}" target="_blank" rel="noopener" title="See current sell listings this offer is based on">${esc(item.name)}</a>`
    : esc(item.name);

  const hasSetPrice = item.wtbPrice!=null && item.wtbPrice>0;
  const sellAvg = item._sellAvg;
  const calculatedOffer = (!hasSetPrice && sellAvg) ? sellAvg.price * (pricingConfig.buyPercentOfSell/100) : null;

  const sellRefHtml = sellAvg
    ? `market sell avg ${fmtMoney(sellAvg.price)} aUEC/${esc(sellAvg.unit)} <span class="${sellAvg.listingsCount<3?'pill warn':''}" style="font-size:9px">${sellAvg.listingsCount} listing${sellAvg.listingsCount===1?'':'s'}</span>`
    : (item._sellAvgErr ? 'no market data at this quality right now' : '<span class="loader"></span>');

  let offerHtml;
  if(hasSetPrice){
    offerHtml = `<div><span class="pill ok" style="font-size:10px">Eagle Company rate (manual)</span> <span class="mono" style="font-size:20px; color:var(--orange); font-weight:700; margin-left:6px">${fmtMoney(item.wtbPrice)} aUEC/${basisLabel}</span></div>
       <div class="muted" style="font-size:11px; margin-top:4px">${sellRefHtml}</div>`;
  } else if(calculatedOffer!=null){
    offerHtml = `<div><span class="pill ok" style="font-size:10px">Eagle Company rate (${pricingConfig.buyPercentOfSell}% of sell avg)</span> <span class="mono" style="font-size:20px; color:var(--orange); font-weight:700; margin-left:6px">${fmtMoney(calculatedOffer)} aUEC/${basisLabel}</span></div>
       <div class="muted" style="font-size:11px; margin-top:4px">${sellRefHtml}</div>`;
  } else {
    offerHtml = `<div>${sellRefHtml}</div>`;
  }

  return `
  <div class="panel${item.activeNeed?' active-need':''}">
    <div class="panel-head">
      <h2>${nameHtml}</h2>
      ${item.activeNeed ? `<span class="pill warn">active build need &middot; &ge;Q${item.quality}</span>` : `<span class="pill ok">band 7 &middot; Q${item.quality}</span>`}
    </div>
    ${offerHtml}
  </div>`;
}

async function loadMaterials(){
  const params = new URLSearchParams(location.search);
  const src = params.get('materialsSrc') || MATERIALS_SOURCE;
  try{
    const res = await fetch(src + (src.includes('?')?'&':'?') + '_=' + Date.now());
    if(!res.ok) throw new Error('HTTP '+res.status);
    return await res.json();
  } catch(e){
    console.error('materials.json load failed', e);
    return [];
  }
}

async function loadPricingConfig(){
  const params = new URLSearchParams(location.search);
  const src = params.get('pricingSrc') || PRICING_SOURCE;
  try{
    const res = await fetch(src + (src.includes('?')?'&':'?') + '_=' + Date.now());
    if(!res.ok) throw new Error('HTTP '+res.status);
    return await res.json();
  } catch(e){
    console.error('pricing-config.json load failed (using default 70%)', e);
    return {buyPercentOfSell: 70};
  }
}

let pricingConfig = {buyPercentOfSell: 70};
let currentTab = 'buylist';
let orderData = null;
let materialsData = null;

async function renderBuyList(){
  const app = document.getElementById('app');
  if(!Array.isArray(orderData) || !orderData.length){
    app.innerHTML = `<div class="panel"><div class="empty">No open needs right now &mdash; nothing queued.</div></div>`;
    return;
  }
  app.innerHTML = orderData.map(item=>`<div id="item-${item.materialId}">${renderMaterialCard(item, [], false)}</div>`).join('')
    + `<div class="refresh-note">Loaded ${new Date().toLocaleString()} &middot; refresh the page for updated prices</div>`;

  await Promise.all(orderData.map(async item=>{
    if(!item.idItem) return;
    const holder = document.getElementById('item-'+item.materialId);
    try{
      const [listings, avg] = await Promise.all([
        fetchTopListings(item.idItem, item.quality, item.unitBasis, 3),
        fetchAveragePrice(item.idItem, item.quality, item.unitBasis, 'sell').catch(e=>{ console.error('average price fetch failed', e); return null; })
      ]);
      holder.innerHTML = renderMaterialCard(item, listings, false, avg);
    } catch(e){
      holder.innerHTML = renderMaterialCard(item, [], true);
    }
  }));
}

async function renderMining(){
  const app = document.getElementById('app');
  if(!materialsData){
    app.innerHTML = `<div class="panel"><div class="empty"><span class="loader"></span> Loading materials&hellip;</div></div>`;
    materialsData = await loadMaterials();
    pricingConfig = await loadPricingConfig();
  }
  const linked = materialsData.filter(m=>m.idItem);
  if(!linked.length){
    app.innerHTML = `<div class="panel"><div class="empty">No UEX-linked materials found.</div></div>`;
    return;
  }

  // active need overrides band-7 default when this material is currently on the buy list
  const activeByMaterialId = {};
  (orderData||[]).forEach(o=>{ activeByMaterialId[o.materialId] = o; });

  const items = linked.map(m=>{
    const active = activeByMaterialId[m.id];
    if(active) return {...m, quality: active.quality, activeNeed: true};
    const b7 = band7Quality(m);
    return b7!=null ? {...m, quality: b7, activeNeed: false} : null;
  }).filter(Boolean);
  // active needs first -- stable sort keeps original ordering within each group
  items.sort((a,b)=>(b.activeNeed?1:0)-(a.activeNeed?1:0));

  if(!items.length){
    app.innerHTML = `<div class="panel"><div class="empty">No materials have quality bands set yet -- add them in Catalog Admin.</div></div>`;
    return;
  }

  app.innerHTML = `<div class="muted" style="font-size:12px; margin-bottom:14px">Eagle Company's buy-back offer -- either a manually-set rate from Catalog Admin, or ${pricingConfig.buyPercentOfSell}% of the live market sell average (deliberately not based on WTB data, which has proven easy for a single listing to distort). Default view is Band 7 (second-highest known quality) for every tracked material; anything currently needed for an active build switches to that build's specific required quality instead.</div>`
    + items.map(item=>`<div id="mine-${item.id}">${renderMiningCard(item)}</div>`).join('')
    + `<div class="refresh-note">Loaded ${new Date().toLocaleString()} &middot; refresh the page for updated prices</div>`;

  await Promise.all(items.map(async item=>{
    const holder = document.getElementById('mine-'+item.id);
    try{
      const avg = await fetchAveragePrice(item.idItem, item.quality, item.unitBasis, 'sell');
      item._sellAvg = avg; item._sellAvgErr = !avg;
    } catch(e){
      console.error('sell average fetch failed', item.name, e);
      item._sellAvgErr = true;
    }
    holder.innerHTML = renderMiningCard(item);
  }));
}

function renderTab(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===currentTab));
  if(currentTab==='buylist') renderBuyList();
  else renderMining();
}

document.getElementById('tabs').addEventListener('click', e=>{
  const t = e.target.closest('.tab');
  if(!t) return;
  currentTab = t.dataset.tab;
  renderTab();
});

async function main(){
  const params = new URLSearchParams(location.search);
  const src = params.get('src') || DEFAULT_SOURCE;
  const app = document.getElementById('app');

  try{
    const res = await fetch(src + (src.includes('?')?'&':'?') + '_=' + Date.now());
    if(!res.ok) throw new Error('HTTP '+res.status);
    orderData = await res.json();
  } catch(e){
    orderData = [];
    app.innerHTML = `<div class="panel"><div class="empty">Couldn't load the purchase order from<br><span class="mono">${esc(src)}</span><br>${esc(e.message)}</div></div>`;
    return;
  }
  renderTab();
}

main();
</script>
</body>
</html>
